# Rebuilds the OSM-based layers of the map (obstacles, built-up areas, crowd places) once a week
# and commits them to data/osm/ on main. The OSM extract is not reachable from the Claude build
# environment, so the fetch runs here. Script: pipeline/osm_build.py
name: osm-layers
on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * 1"        # Mondays 01:17 UTC
permissions:
  contents: write
concurrency: osm-layers
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download and pre-filter the OSM extract (Geofabrik, updated daily)
        run: |
          sudo apt-get install -y -q osmium-tool > /dev/null
          pip install -q osmium
          curl -sS -L -f -m 900 -o il.osm.pbf https://download.geofabrik.de/asia/israel-and-palestine-latest.osm.pbf
          ls -la il.osm.pbf
          osmium tags-filter il.osm.pbf \
            w/power=line,minor_line w/aerialway \
            nwr/man_made=mast,tower,communications_tower,chimney,crane nwr/generator:source=wind \
            nwr/landuse=residential,commercial,retail,industrial \
            nwr/amenity=school,university,college,hospital,marketplace,bus_station \
            nwr/leisure=stadium,water_park nwr/shop=mall nwr/tourism=theme_park,zoo nwr/natural=beach nwr/railway=station \
            nwr/building:levels nwr/height \
            -o filtered.osm.pbf
          ls -la filtered.osm.pbf
      - name: Build
        run: python3 pipeline/osm_build.py osm-out data/basemap.json --pbf filtered.osm.pbf
      - name: Sanity check (never publish a broken or shrunken data set)
        run: |
          python3 - <<'PY'
          import json, sys
          new = json.load(open("osm-out/index.json"))["counts"]
          old = json.load(open("data/osm/index.json"))["counts"]
          print("old", old); print("new", new)
          for k in ("lines", "minor", "pts", "built", "crowd"):
              if new[k] < 0.7 * old[k]:
                  sys.exit(f"{k}: {old[k]} -> {new[k]} (more than 30% fewer) - not publishing")
          PY
      - name: Commit to main
        run: |
          rm -rf data/osm && mv osm-out data/osm
          git config user.name "osm-layers"
          git config user.email "actions@users.noreply.github.com"
          git add data/osm
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "OSM layers $(date -u +%F)"
          git push -q origin HEAD:main || { git pull -q --rebase origin main && git push -q origin HEAD:main; }
