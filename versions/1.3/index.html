<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מפת מרחב אווירי לכטב"ם – ישראל</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="css/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div style="position:fixed;bottom:0;left:0;right:0;z-index:3000;background:#5b21b6;color:#fff;text-align:center;font:600 13px Heebo,Arial;padding:6px">גרסה מוקפאת 1.3 – לא מתעדכנת. <a style="color:#ffd166" href="https://harelrynar.github.io/drone-map-il/">לגרסה העדכנית ←</a></div>
<header class="topbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><circle cx="25" cy="7" r="4.5"/><circle cx="7" cy="25" r="4.5"/><circle cx="25" cy="25" r="4.5"/><path d="M10 10l12 12M22 10L10 22"/><rect x="12.5" y="12.5" width="7" height="7" rx="1.5"/></svg>
    <div>
      <h1 data-i18n="title"></h1>
      <div class="sub" id="updatedLine"></div>
    </div>
  </div>
  <div class="search-wrap" id="searchWrap">
    <input id="search" type="search" autocomplete="off" data-i18n-ph="search">
    <div id="searchResults" class="search-results" hidden></div>
  </div>
  <div class="top-actions">
    <button id="btnNews" class="chip" type="button"><span data-i18n="whatsNew"></span><b id="newsBadge" hidden></b></button>
    <button id="btnLang" class="chip" type="button"></button>
  </div>
</header>

<div id="demoRibbon" class="ribbon" hidden><b data-i18n="demo"></b> <span data-i18n="demoSub"></span></div>
<div id="banner" class="banner" hidden></div>

<main id="map" aria-label="map"></main>

<button id="btnLayers" class="fab layers-top" type="button"><svg viewBox="0 0 24 24"><path d="M12 3 2 8l10 5 10-5-10-5zm-7.6 8.3L2 12.5l10 5 10-5-2.4-1.2L12 15l-7.6-3.7zm0 4.5L2 17l10 5 10-5-2.4-1.2L12 19.5l-7.6-3.7z"/></svg><span data-i18n="layers"></span></button>

<div class="fabs">
  <button id="btnCheck" class="fab primary" type="button" aria-label="check">
    <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
    <span data-i18n="checkHere"></span>
  </button>
  <button id="btnFilters" class="fab" type="button"><svg viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg><span data-i18n="filters"></span><i id="filterDot" hidden></i></button>
</div>

<!-- side panel / bottom sheet -->
<section id="sheet" class="sheet" hidden aria-live="polite">
  <div class="sheet-grip"></div>
  <button class="sheet-close" id="sheetClose" type="button" aria-label="close">✕</button>
  <div id="sheetBody"></div>
</section>

<footer class="foot">
  <button id="btnAbout" type="button" class="linkish"></button>
</footer>

<script src="js/leaflet.js"></script>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/geo.js"></script>
<script src="js/app.js"></script>
</body>
</html>
